<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Settings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <link rel="stylesheet" href="./CSS/base.css">
  <link rel="stylesheet" href="./CSS/settings.css">
</head>

<body class="bg-light">

<div class="container my-5">
  <div class="row justify-content-center">

    <div class="col-lg-8">

      <div class="card shadow-sm">
        <div class="card-body p-4">

          <h5 class="fw-bold mb-4">Account Settings</h5>

          <div class="settings-item">
            <i class="bi bi-bell"></i>
            <div>
              <p class="mb-0 fw-semibold">Notifications</p>
              <small>Email & order alerts</small>
            </div>
          </div>

          <div class="settings-item">
            <i class="bi bi-lock"></i>
            <div>
              <p class="mb-0 fw-semibold">Privacy & Security</p>
              <small>Password & data controls</small>
            </div>
          </div>

          <div class="settings-item">
            <i class="bi bi-credit-card"></i>
            <div>
              <p class="mb-0 fw-semibold">Payment Methods</p>
              <small>Manage cards & UPI</small>
            </div>
          </div>

          <div class="settings-item">
            <i class="bi bi-translate"></i>
            <div>
              <p class="mb-0 fw-semibold">Language</p>
              <small>Choose preferred language</small>
            </div>
          </div>

          <hr>

          <div class="text-end">
            <button class="btn btn-outline-secondary" onclick="goBack()">
              Back to Profile
            </button>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>

<script src="./js/settings.js"></script>
</body>
</html>
