<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Your base css -->
  <link rel="stylesheet" href="./CSS/base.css">
  <link rel="stylesheet" href="./CSS/login.css">
</head>

<body class="bg-light">

  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-md-5 col-lg-4">

        <div class="card shadow-sm p-4">
          <div class="text-center mb-3">
            <img src="./Resources/Icons/icon.png" width="180" alt="Logo">
          </div>

          <h5 class="text-center fw-bold mb-3">Sign in to your account</h5>

          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" id="name" class="form-control" placeholder="Enter your name">
          </div>

          <div class="mb-3">
            <label class="form-label">Email address</label>
            <input type="email" id="email" class="form-control" placeholder="Enter email">
          </div>

          <button class="btn btn-primary w-100" onclick="loginUser()">
            Login
          </button>

          <p class="text-center small mt-3 text-muted">
            By continuing, you agree to our
            <a href="#">Terms</a> & <a href="#">Privacy Policy</a>
          </p>
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Login logic -->
  <script src="./js/login.js"></script>
</body>
</html>
