<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shops</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="./CSS/base.css">
    <link rel="stylesheet" href="./CSS/shop.css">


</head>

<body>
    <header>
        <!-- header with navigation bar -->

         <nav class="navbar navbar-expand-lg navbar-gradient fixed-top" data-bs-theme="dark" id="navBar">

        </nav>
    </header>
    <!-- main section started -->
    <main>
        <div class="container">
            <!-- header section -->
            <h1>Shop All Products</h1>
            <p class="text-muted">show 8 of 8 products</p>

            <!-- content -->
            <div class="container-fluid">
                <div class="row">
                    <!-- aside section -->
                    <div class="col-md-3 border rounded-4 space-y-6 p-3 mb-4 align-self-start">
                        <!-- filter head start -->
                        <div class="d-flex align-items-center gap-2 mb-3 filter-header">
                            <i class="bi bi-funnel fs-5 "></i>
                            <h5 class="mb-0 fw-semibold">Filter By</h5>
                        </div>



                        <!-- Price Range start-->
                        <div class="mb-4">
                            <h6 class="fw-semibold">Price Range</h6>

                            <div class="dual-range">
                                <input type="range" id="minRange" min="0" max="500" value="0">
                                <input type="range" id="maxRange" min="0" max="500" value="500">
                                <div class="range-fill"></div>
                            </div>

                            <div class="d-flex justify-content-between mt-2 text-muted">
                                <span>Rs <span id="minVal">0</span></span>
                                <span>Rs <span id="maxVal">500</span></span>
                            </div>
                        </div>









                        <script>
                            const minRange = document.getElementById("minRange");
                            const maxRange = document.getElementById("maxRange");
                            const minVal = document.getElementById("minVal");
                            const maxVal = document.getElementById("maxVal");
                            const rangeFill = document.querySelector(".range-fill");

                            const maxValue = 500;
                            const minGap = 10;

                            function updateRange() {
                                let min = parseInt(minRange.value);
                                let max = parseInt(maxRange.value);

                                if (max - min < minGap) {
                                    if (this === minRange) {
                                        minRange.value = max - minGap;
                                    } else {
                                        maxRange.value = min + minGap;
                                    }
                                }

                                minVal.textContent = minRange.value;
                                maxVal.textContent = maxRange.value;

                                const left = (minRange.value / maxValue) * 100;
                                const right = (maxRange.value / maxValue) * 100;

                                rangeFill.style.left = left + "%";
                                rangeFill.style.width = (right - left) + "%";
                            }

                            minRange.addEventListener("input", updateRange);
                            maxRange.addEventListener("input", updateRange);

                            // init
                            updateRange.call(minRange);
                        </script>




                        <!-- price range end -->

                        <!-- category start -->
                        <div>
                            <h6>Category</h6>
                            <ul class="list-unstyled">
                                <li> <input type="checkbox" id="electronics" class="mt-3"> <label
                                        for="electronics">Clothing</label>
                                </li>
                                <li> <input type="checkbox" id="Fashion" class="mt-3"> <label
                                        for="Fashion">Home Appliances</label></li>
                                <li> <input type="checkbox" id="home" class="mt-3"> <label for="home">Toys</label></li>
                                <li> <input type="checkbox" id="toys" class="mt-3"> <label for="toys">Mobile</label>
                                </li>
                                <li> <input type="checkbox" id="toys" class="mt-3"> <label for="toys">Electronics</label>
                                </li>
                                <li> <input type="checkbox" id="toys" class="mt-3"> <label for="toys">Beauty</label>
                                </li>
                                <li> <input type="checkbox" id="toys" class="mt-3"> <label for="toys">Sports</label>
                                </li>
                                <li> <input type="checkbox" id="toys" class="mt-3"> <label for="toys">Watches</label>
                                </li>
                                <li> <input type="checkbox" id="toys" class="mt-3"> <label for="toys">Footwear</label>
                                </li>
                                <li> <input type="checkbox" id="toys" class="mt-3"> <label for="toys">Medical Equipments</label>
                                </li>

                            </ul>
                        </div>
                        <!-- category end -->

                        <!-- Rating Start -->
                        <h6>Rating</h6>
                        <ul class="list-unstyled">
                            <li> <input type="checkbox" id="rating5" class="mt-3"> <label for="rating5">4+ Stars</label>
                            </li>
                            <li> <input type="checkbox" id="rating4" class="mt-3"> <label for="rating4">3+ Stars</label>
                            </li>
                            <li> <input type="checkbox" id="rating3" class="mt-3"> <label for="rating3">2+ Stars</label>
                            </li>
                            <li> <input type="checkbox" id="rating2" class="mt-3"> <label for="rating2">1+ Stars</label>
                            </li>
                        </ul>
                        <!-- Rating End -->

                        <!-- Reset button -->
                        <div class="d-flex justify-content-center mt-4">
                            <button class="btn btn-outline-secondary d-flex align-items-center gap-2 px-4 py-2 rounded"
                                aria-label="Reset Filters">
                                <i class="bi bi-x fs-5"></i>
                                <span class="fw-semibold">Reset Filters</span>
                            </button>
                        </div>


                        <!-- Reset button end -->
                    </div>
                    <div class="col-md-9">
                        <!-- featured button start -->
                        <div class="dropdown mb-4 d-flex justify-content-end">
                            <button class="btn border btn-lg dropdown-toggle" type="button" data-bs-toggle="dropdown"
                                aria-expanded="false">
                                Featured
                            </button>
                            <ul class="dropdown-menu dropdown-menu-dark">
                                <li><a class="dropdown-item active" href="#">Featured</a></li>
                                <li><a class="dropdown-item" href="#">Price: Low to High</a></li>
                                <li><a class="dropdown-item" href="#">Price: High to Low</a></li>
                                <li><a class="dropdown-item" href="#">Highest Rated</a></li>
                            </ul>
                        </div>
                        <!-- featured button end -->

                        <!-- aside end -->
                        <div class="container-fluid">
                            <div class="row" id="allProducts">
                                <!-- products will be displayed here -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>




        </div>
    </main>
    <!-- footer section started -->
    <footer class="footer-gradient text-light pt-5 pb-4" id="footerSection">
        <div class="container" >
            

        </div>
    </footer>


<script src="./js/navigation.js"></script>    
<script src="./js/shop.js"></script>    
<script src="./js/footer.js"></script>

    <!-- footer section ended -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
