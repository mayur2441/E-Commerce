<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="./CSS/base.css">
    <link rel="stylesheet" href="CSS/order.css">



</head>

<body>
    <header>
        <!-- header with navigation bar -->
         <nav class="navbar navbar-expand-lg navbar-gradient fixed-top" data-bs-theme="dark" id="navBar">

        </nav>
    </header>
    <!-- main section started -->
    <main>
        <!-- Section Started -->
        <section>

          <div class="container">
    <div class="my-3 my-md-4">
        <h2 class="fw-bold">My Orders</h2>
        <small class="text-muted d-block">Track and manage your orders</small>
    </div>

    <div class="row">

        <!-- ================= ORDER 1 ================= -->
        <div class="col-12 border order-card d-flex flex-column flex-md-row align-items-start align-items-md-center justify-content-between mb-3 p-3">

            <div class="order-image mb-3 mb-md-0">
                <img class="img-fluid order-img" src="./Resources/Images/luxury.jpeg" alt="">
            </div>

            <div class="flex-grow-1 ms-md-4">
                <h6 class="mb-1 fw-bold">Order #FS12345678</h6>
                <small class="text-muted d-block mb-2">January 25, 2026</small>

                <div class="d-flex flex-wrap align-items-center gap-2 gap-md-3">
                    <span class="status-shipped">
                        <i class="bi bi-truck"></i> Shipped
                    </span>
                    <span class="text-muted">2 items</span>
                    <span class="fw-semibold">Total: ₹299.99</span>
                </div>

                <div class="mt-3 d-flex flex-wrap gap-2">
                    <button class="btn btn-primary btn-sm">Track Order</button>
                    <button class="btn btn-outline-secondary btn-sm">Reorder</button>
                    <button class="btn btn-outline-secondary btn-sm">View Details</button>
                </div>
            </div>

            <div class="ms-md-3 mt-3 mt-md-0 align-self-md-start">
                <i class="bi bi-three-dots-vertical fs-5"></i>
            </div>
        </div>

        <!-- ================= ORDER 2 ================= -->
        <div class="col-12 border order-card d-flex flex-column flex-md-row align-items-start align-items-md-center justify-content-between mb-3 p-3">

            <div class="order-image mb-3 mb-md-0">
                <img class="img-fluid order-img" src="./Resources/Images/iphone.jpeg" alt="">
            </div>

            <div class="flex-grow-1 ms-md-4">
                <h6 class="mb-1 fw-bold">Order #FS12345679</h6>
                <small class="text-muted d-block mb-2">January 25, 2026</small>

                <div class="d-flex flex-wrap align-items-center gap-2 gap-md-3">
                    <span class="badge-delivered">
                        <i class="bi bi-check2-circle"></i> Delivered
                    </span>
                    <span class="text-muted">1 item</span>
                    <span class="fw-semibold">Total: ₹59,999</span>
                </div>

                <div class="mt-3 d-flex flex-wrap gap-2">
                    <button class="btn btn-primary btn-sm">Track Order</button>
                    <button class="btn btn-outline-secondary btn-sm">Reorder</button>
                    <button class="btn btn-outline-secondary btn-sm">View Details</button>
                </div>
            </div>

            <div class="ms-md-3 mt-3 mt-md-0 align-self-md-start">
                <i class="bi bi-three-dots-vertical fs-5"></i>
            </div>
        </div>

        <!-- ================= ORDER 3 ================= -->
        <div class="col-12 border order-card d-flex flex-column flex-md-row align-items-start align-items-md-center justify-content-between mb-3 p-3">

            <div class="order-image mb-3 mb-md-0">
                <img class="img-fluid order-img" src="./Resources/Images/womendress.jpeg" alt="">
            </div>

            <div class="flex-grow-1 ms-md-4">
                <h6 class="mb-1 fw-bold">Order #FS12345680</h6>
                <small class="text-muted d-block mb-2">January 25, 2026</small>

                <div class="d-flex flex-wrap align-items-center gap-2 gap-md-3">
                    <span class="badge-delivered">
                        <i class="bi bi-check2-circle"></i> Delivered
                    </span>
                    <span class="text-muted">1 item</span>
                    <span class="fw-semibold">Total: ₹1,299.99</span>
                </div>

                <div class="mt-3 d-flex flex-wrap gap-2">
                    <button class="btn btn-primary btn-sm">Track Order</button>
                    <button class="btn btn-outline-secondary btn-sm">Reorder</button>
                    <button class="btn btn-outline-secondary btn-sm">View Details</button>
                </div>
            </div>

            <div class="ms-md-3 mt-3 mt-md-0 align-self-md-start">
                <i class="bi bi-three-dots-vertical fs-5"></i>
            </div>
        </div>

    </div>
</div>

        </section>
        <!-- Section End  -->
    </main>
    <!-- Main section End  -->

    <!-- footer section started -->

    <footer class="footer-gradient text-light pt-5 pb-4" id="footerSection">
        <div class="container" >
            

        </div>
    </footer>


<script src="./js/navigation.js"></script>    
<script src="./js/footer.js"></script>

    <!-- footer section ended -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
